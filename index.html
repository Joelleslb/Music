<!DOCTYPE html>
<html>
    <head>
        <!-- This is for making the website responsive. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Importing bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Link to the css stylesheet -->
        <link rel="stylesheet" href="style.css">
        <!-- Importing a font form google fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Qwitcher+Grypen:wght@400;700&display=swap" rel="stylesheet">
        <!-- Link to the JS file -->
        <script src="script.js"></script>
      </head>
    <body>
      <!-- Start of preloader -->
      <div id="preloader"></div>
      <!-- End of preloader -->
        <!-- Start of header -->
        <header>
            <img id="note" src="https://pngimg.com/d/music_notes_PNG37.png" alt="music note">
            <!-- Start of nav bar -->
            <nav>
                <a href="index.html">HOME</a>
                <a href="pop.html">POP</a>
                <a href="rock.html">ROCK</a>
            </nav>
            <!-- End of nav bar -->
        </header>
        <!-- End of header -->
        <!-- Start of the main section -->
        <div id="main">
            <div id="introduction">
                <h1 id="title"><span class="blue">EXPLORE</span> <span class="stacked">the world of</span> <span class="stacked blue">MUSIC.</span></h1>
                <p id="intro">Dive into a world of music insights, from legendary artists to emerging trends, and let your passion for sound find its perfect harmony here.</p>
            </div>
            <img id="concert" src="https://cdn.pixabay.com/photo/2020/02/06/08/19/band-4823341_1280.jpg" alt="music concert">
        </div>
        <!-- End of the main section -->
        <!-- Start of the explore section -->
        <div id="explore">
            <!-- This ticket links to the pop page. -->
            <a href="pop.html"> 
                <div id="pop" class="ticket">
                    <h1>POP</h1>
                </div>
            </a>
            <!-- And this ticket links to the rock page. -->
            <a href="rock.html">
                <div id="rock" class="ticket">
                    <h1>ROCK</h1>
                </div>
            </a>
        </div>
        <!-- End of the explore section -->
        <!-- Start of the carousel imported from the bootstrap library -->
        <div id="carousel">
            <div id="carouselExample" class="carousel slide">
              <div class="carousel-inner">
                <div class="carousel-item active">
                  <img src="https://images.unsplash.com/photo-1730875651456-9c9cde899602?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                  <img src="https://images.pexels.com/photos/8198213/pexels-photo-8198213.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                  <img src="https://images.pexels.com/photos/8412281/pexels-photo-8412281.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" class="d-block w-100" alt="...">
                </div>
              </div>
              <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
              </button>
              <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
              </button>
            </div>
          </div>
          <!-- End of the carousel imported from the bootstrap library -->
          <!-- Start of java script import from bootstrap -->
          <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.min.js"></script>
          <!-- End of java script import from bootstrap -->
    </body>
</html>
